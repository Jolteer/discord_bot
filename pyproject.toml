[project]
name = "joltbot"
version = "0.1.0"
description = "Multi-server Discord bot with a web dashboard"
requires-python = ">=3.11"  # pydantic-settings needs 3.11; Docker and CI run 3.12

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # discord.py's voice module imports audioop; JoltBot doesn't use voice.
    "ignore:'audioop' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"  # matches requires-python
extend-exclude = ["migrations/versions"]  # generated by Alembic

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused names, undefined names), I: import order,
# B: common bug patterns, UP: modern syntax for the target Python version (see target-version).
select = ["E", "W", "F", "I", "B", "UP"]
# UP017 wants datetime.UTC instead of timezone.utc. They are the same object; not worth the churn.
ignore = ["UP017"]

[tool.mypy]
# Type-checks the application code. Tests are left out: they are built on mocks, which
# mypy can say little about.
files = ["joltbot", "scripts"]
python_version = "3.11"  # matches requires-python
plugins = ["pydantic.mypy"]  # understands the fields and validators of the settings models
# Not --strict yet. These are the checks that find real mistakes without demanding an
# annotation on every function first.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
