{% extends "base.html" %}
{% block title %}{{ title }} · JoltBot{% endblock %}
{% block content %}
<div class="mx-auto max-w-md jb-card p-6 text-center">
  <h1 class="text-xl font-bold tracking-tight">{{ title }}</h1>
  <p class="mt-2 text-sm text-jb-muted">{{ message }}</p>
  <div class="mt-5 flex justify-center gap-2">
    {% if retry_url %}
      <a href="{{ retry_url }}" class="jb-btn-primary">Try again</a>
    {% endif %}
    <a href="{{ '/servers' if user else '/' }}" class="jb-btn-secondary">Back</a>
  </div>
</div>
{% endblock %}
