{% extends "base.html" %}
{% block title %}{{ title }} · JoltBot{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg rounded-xl border border-slate-800 bg-slate-900 p-8 text-center">
  <h1 class="text-2xl font-bold">{{ title }}</h1>
  <p class="mt-3 text-slate-300">{{ message }}</p>
  <div class="mt-6 flex justify-center gap-3">
    {% if retry_url %}
      <a href="{{ retry_url }}" class="rounded-md bg-amber-400 px-4 py-2 font-semibold text-slate-950 hover:bg-amber-300">Try again</a>
    {% endif %}
    <a href="{{ '/servers' if user else '/' }}" class="rounded-md border border-slate-700 px-4 py-2 font-semibold hover:bg-slate-800">Back</a>
  </div>
</div>
{% endblock %}
