{% extends "guild/_layout.html" %}
{% block page %}
<h1 class="text-xl font-bold tracking-tight">Audit log</h1>
<p class="mt-1 text-sm text-jb-muted">Every settings change for this server, newest first.</p>
{% if entries %}
  <div class="jb-card mt-4 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm">
        <thead class="bg-jb-surface-2 text-xs uppercase tracking-wide text-jb-subtle">
          <tr><th class="px-3 py-2 font-semibold">When (UTC)</th><th class="px-3 py-2 font-semibold">Who</th><th class="px-3 py-2 font-semibold">What changed</th></tr>
        </thead>
        <tbody id="audit-rows" class="divide-y divide-jb-border">
          {% include "guild/_audit_rows.html" %}
        </tbody>
      </table>
    </div>
  </div>
{% else %}
  <p class="mt-4 text-sm text-jb-muted">No changes yet.</p>
{% endif %}
{% endblock %}
