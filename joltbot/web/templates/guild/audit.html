{% extends "guild/_layout.html" %}
{% block page %}
<h1 class="text-2xl font-bold">Audit log</h1>
<p class="mt-1 text-sm text-slate-400">Every settings change for this server, newest first.</p>
{% if entries %}
  <div class="mt-6 overflow-hidden rounded-xl border border-slate-800">
    <table class="w-full text-left text-sm">
      <thead class="bg-slate-900 text-xs uppercase tracking-wide text-slate-400">
        <tr><th class="px-4 py-2">When (UTC)</th><th class="px-4 py-2">Who</th><th class="px-4 py-2">What changed</th></tr>
      </thead>
      <tbody id="audit-rows" class="divide-y divide-slate-800">
        {% include "guild/_audit_rows.html" %}
      </tbody>
    </table>
  </div>
{% else %}
  <p class="mt-6 text-sm text-slate-400">No changes yet.</p>
{% endif %}
{% endblock %}
