# Runs on every push and pull request: lint, format check, tests, then a Docker build + smoke test.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t joltbot:ci .
      - name: Smoke test (migrate, start the dashboard, check /health)
        run: |
          docker volume create ci-data
          docker run --rm -v ci-data:/app/data joltbot:ci alembic upgrade head
          docker run -d --name web -p 8000:8000 -v ci-data:/app/data \
            -e DISCORD_TOKEN=x -e DISCORD_CLIENT_ID=1 -e DISCORD_CLIENT_SECRET=x -e SESSION_SECRET=x \
            joltbot:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs web
          exit 1
